<!DOCTYPE html>
<html>
<head>
  <title>Table Layout Example</title>
   
</head>
<body>

  <table border="1" cellspacing="5" >
    <tr>
      <td>A</td>
      <td>B</td>
      <td>C</td>
      <td>D</td>
    </tr>

    <tr>
      <td rowspan="3">E</td>
      <td rowspan="3">F</td>
      <td>AA</td>
      <td rowspan="2">DD</td>
    </tr>

    <tr>
      <td>BB</td>
    </tr>

    <tr>
      <td>CC</td>
      <td>EE</td>   
    </tr>

    <tr>
      <td>G</td>
      <td>H</td>

      <td>J</td>
    </tr>
  </table>

</body>
</html>
